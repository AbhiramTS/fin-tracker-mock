name: Deploy to GitHub Pages

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

# Allow one concurrent deployment
concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type-check
              run: npm run typecheck

            - name: Build
              run: npm run build
              # If your repo is at https://username.github.io/fintracker/
              # (not a custom domain), set the base path:
              # env:
              #   VITE_BASE_PATH: /fintracker/
              # And update vite.config.ts:  base: process.env.VITE_BASE_PATH ?? "/"

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
