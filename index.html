<!doctype html>
<html
	lang="en"
	class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<!-- Tell HTTP caches never to store the HTML shell; SW handles caching -->
		<meta
			http-equiv="Cache-Control"
			content="no-cache, no-store, must-revalidate" />
		<meta
			http-equiv="Pragma"
			content="no-cache" />
		<meta
			http-equiv="Expires"
			content="0" />
		<meta
			name="theme-color"
			content="#07090f" />
		<meta
			name="mobile-web-app-capable"
			content="yes" />
		<meta
			name="apple-mobile-web-app-capable"
			content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent" />
		<meta
			name="apple-mobile-web-app-title"
			content="FinTracker" />
		<meta
			name="description"
			content="Local-first personal finance — forecasting, goals, reconciliation, Firebase sync" />
		<link
			rel="manifest"
			href="/manifest.json" />
		<link
			rel="apple-touch-icon"
			href="/icon-192.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="192x192"
			href="/icon-192.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="512x512"
			href="/icon-512.png" />
		<title>FinTracker</title>
	</head>
	<body>
		<div id="root"></div>
		<script
			type="module"
			src="/src/main.tsx"></script>
	</body>
</html>
